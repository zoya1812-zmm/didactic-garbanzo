<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Classification App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      color: #0078d4;
      margin-bottom: 1rem;
    }

    .card {
      background: white;
      padding: 20px 30px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    button {
      width: 100%;
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #005ea6;
    }

    .result {
      margin-top: 20px;
      font-size: 1rem;
      text-align: center;
    }

    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🔗 URL Classification</h1>
    <input type="text" id="urlInput" placeholder="Enter URL here..." />
    <button onclick="predict()">Predict</button>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function predict() {
      const url = document.getElementById('urlInput').value.trim();
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = "⏳ Predicting...";
      
      if (!url) {
        resultDiv.innerHTML = "<span class='error'>⚠️ Please enter a URL</span>";
        return;
      }

      try {
        const response = await fetch('https://lengthy-ronald-unmetallurgically.ngrok-free.dev/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `
            ✅ <b>Prediction:</b> ${data.predicted_class}<br/>
            🎯 <b>Confidence:</b> ${data.confidence}%
          `;
        } else {
          resultDiv.innerHTML = `<span class='error'>❌ Error: ${data.error || 'Something went wrong'}</span>`;
        }

      } catch (err) {
        resultDiv.innerHTML = `<span class='error'>🚨 Request failed: ${err.message}</span>`;
      }
    }
  </script>
</body>
</html>
